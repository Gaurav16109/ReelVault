services:
  postgres:
    image: postgres:16
    container_name: reelvault-postgres
    environment:
      POSTGRES_DB: reelvault
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - reelvault-postgres-data:/var/lib/postgresql/data

volumes:
  reelvault-postgres-data:
